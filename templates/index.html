<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Profile Automation Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="mb-4 text-center">Multi-Profile Automation Dashboard</h2>
    
    <!-- Add Profile Form -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title">নতুন প্রোফাইল যুক্ত করুন</h5>
            <form id="addProfileForm" class="row g-3">
                <div class="col-md-3">
                    <input type="text" id="name" class="form-control" placeholder="Profile Name" required>
                </div>
                <div class="col-md-3">
                    <input type="email" id="email" class="form-control" placeholder="FB Email" required>
                </div>
                <div class="col-md-3">
                    <input type="password" id="password" class="form-control" placeholder="FB Password" required>
                </div>
                <div class="col-md-3">
                    <input type="text" id="comment" class="form-control" placeholder="Comment Text" required>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary">Add Profile</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Profiles List -->
    <div class="row" id="profilesContainer"></div>
</div>

<script>
async function loadProfiles() {
    const res = await fetch('/get-profiles');
    const profiles = await res.json();
    const container = document.getElementById('profilesContainer');
    container.innerHTML = '';

    profiles.forEach(p => {
        const isRunning = p.status === 'Running';
        container.innerHTML += `
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">${p.name}</h5>
                        <p class="card-text text-muted mb-1">${p.email}</p>
                        <p class="card-text"><strong>Status:</strong> <span class="badge ${isRunning ? 'bg-success' : 'bg-secondary'}">${p.status}</span></p>
                        <button class="btn btn-sm btn-success me-2" onclick="startProfile('${p.id}')" ${isRunning ? 'disabled' : ''}>Start</button>
                        <button class="btn btn-sm btn-danger me-2" onclick="stopProfile('${p.id}')" ${!isRunning ? 'disabled' : ''}>Stop</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProfile('${p.id}')">Delete</button>
                    </div>
                </div>
            </div>
        `;
    });
}

document.getElementById('addProfileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const profile = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        comment: document.getElementById('comment').value
    };
    await fetch('/add-profile', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(profile)
    });
    e.target.reset();
    loadProfiles();
});

async function startProfile(id) {
    await fetch(`/start-profile/${id}`, {method: 'POST'});
    loadProfiles();
}

async function stopProfile(id) {
    await fetch(`/stop-profile/${id}`, {method: 'POST'});
    loadProfiles();
}

async function deleteProfile(id) {
    await fetch(`/delete-profile/${id}`, {method: 'POST'});
    loadProfiles();
}

setInterval(loadProfiles, 5000);
loadProfiles();
</script>
</body>
</html>
