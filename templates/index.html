<!DOCTYPE html>
<html lang="bn" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Auto Commenter Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="h-full text-slate-100 font-sans antialiased flex items-center justify-center p-4">

    <div class="w-full max-w-xl bg-slate-800/80 backdrop-blur-md rounded-2xl border border-slate-700/50 shadow-2xl overflow-hidden my-8">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-center relative">
            <h1 class="text-2xl font-bold tracking-tight text-white">FB Auto-Commenter Panel</h1>
            <p class="text-blue-100 text-sm mt-1">স্বয়ংক্রিয় পেজ সুইচ ও কমেন্ট অটোমেশন</p>
        </div>

        <form id="automationForm" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Facebook Email / Phone</label>
                <input type="text" id="email" required placeholder="ইমেইল বা ফোন নম্বর"
                    class="w-full px-4 py-2.5 bg-slate-900/60 border border-slate-700 rounded-xl outline-none text-sm text-white">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Facebook Password</label>
                <input type="password" id="password" required placeholder="পাসওয়ার্ড"
                    class="w-full px-4 py-2.5 bg-slate-900/60 border border-slate-700 rounded-xl outline-none text-sm text-white">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Desired Comment Text</label>
                <textarea id="comment" rows="3" required placeholder="কমেন্ট লিখুন..."
                    class="w-full px-4 py-2.5 bg-slate-900/60 border border-slate-700 rounded-xl outline-none text-sm text-white"></textarea>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg transition-all">
                Start Automation
            </button>
        </form>

        <div id="statusBox" class="hidden p-4 mx-6 mb-6 rounded-xl border transition-all">
            <div id="statusMessage" class="text-xs font-medium leading-relaxed"></div>
        </div>
    </div>

    <!-- Block Pop-up Modal -->
    <div id="blockModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-red-500/50 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
            <div class="w-12 h-12 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
            </div>
            <h3 class="text-lg font-bold text-white mb-2">SYSTEM STOPPED</h3>
            <p id="modalText" class="text-sm text-red-300 mb-6">Your comment has been blocked.</p>
            <button onclick="closeModal()" class="w-full py-2.5 bg-red-600 hover:bg-red-500 text-white font-semibold rounded-xl transition-all">
                Close
            </button>
        </div>
    </div>

    <script>
        function closeModal() {
            document.getElementById('blockModal').classList.add('hidden');
        }

        document.getElementById('automationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusBox');
            const statusMsg = document.getElementById('statusMessage');
            const blockModal = document.getElementById('blockModal');
            const modalText = document.getElementById('modalText');

            const payload = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                comment: document.getElementById('comment').value
            };

            submitBtn.disabled = true;
            submitBtn.innerText = "অটোমেশন চলছে...";
            statusBox.classList.remove('hidden');
            statusMsg.innerText = "লগইন হয়ে পেজে সুইচ করার প্রসেস চলছে...";

            try {
                const response = await fetch('/start-automation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    statusMsg.innerText = result.message;
                } else {
                    statusMsg.innerText = result.message;
                    if (result.message.includes("BLOCKED")) {
                        modalText.innerText = result.message;
                        blockModal.classList.remove('hidden');
                    }
                }
            } catch (err) {
                statusMsg.innerText = "সার্ভারের সাথে কানেক্ট করা যায়নি!";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Start Automation";
            }
        });
    </script>
</body>
</html>
